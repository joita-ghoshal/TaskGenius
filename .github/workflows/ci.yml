name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  server-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskgenius_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskgenius_test?schema=public
      NODE_ENV: test
      JWT_SECRET: test-jwt-secret-for-ci
      JWT_EXPIRE: 1h
      CLIENT_URL: http://localhost:5173
      CRON_SECRET: test-cron-secret
      DISABLE_SCHEDULER: 'true'
      VAPID_PUBLIC_KEY: BLeG11ISlneH2dcv76fyI0ai5vCXwQr9CjyGE-gOqtGUYvVj9JGhkUaZ4sAR9df7ebGGj9uc2k3mcdDsrw3paFQ
      VAPID_PRIVATE_KEY: yR_VXYF-tsvc9Ibz0uTQmfPF5IKlTWhh3w7J-VsaKf0
      VAPID_SUBJECT: mailto:tests@taskgenius.app
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      EMAIL_HOST: ''
      EMAIL_USER: ''
      EMAIL_PASS: ''
      EMAIL_FROM: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Validate Prisma schema
        working-directory: server
        run: npx prisma validate
      - name: Push schema
        working-directory: server
        run: npx prisma db push --skip-generate
      - name: Run server tests
        working-directory: server
        run: npx vitest run

  client-tests:
    runs-on: ubuntu-latest
    needs: [server-tests]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        working-directory: client
        run: npm ci
      - name: Run client unit tests
        working-directory: client
        run: npx vitest run

  deploy-render:
    runs-on: ubuntu-latest
    needs: [server-tests, client-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-d9b7q5reo5us73e45430
        run: |
          curl -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}'

  cron-maintenance:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Run internal maintenance cron
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          API_URL: ${{ secrets.TASKGENIUS_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "TASKGENIUS_API_URL not set; skipping"
            exit 0
          fi
          curl -X POST "${API_URL}/api/internal/cron" \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --fail-with-body
